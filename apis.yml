apis:
- name: Sensu Go Backend REST API
  description: >-
    The Sensu Go backend REST API for managing observability resources: checks,
    events, entities, filters, handlers, mutators, hooks, pipelines, assets,
    silences, namespaces, roles, role bindings, cluster roles, API keys, and users.
    Core endpoints follow /api/core/v2/namespaces/<namespace>; enterprise endpoints
    follow /api/enterprise/<group>/v2. Authenticates with JWT access tokens (via
    /auth) or persistent API keys (Authorization: Key <uuid>). Supports limit/continue
    pagination, labelSelector/fieldSelector filtering, and Etag conditional requests.
  humanURL: https://docs.sensu.io/sensu-go/latest/api/
