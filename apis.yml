aid: sensu
name: Sensu
description: >-
  Sensu (Sensu by Sumo Logic) is an observability pipeline that delivers monitoring
  as code across multi-cloud and hybrid environments. Sensu Go codifies monitoring
  workflows into declarative, versionable configuration and exposes a backend REST
  API (core/v2 plus namespaced and cluster-wide enterprise APIs) for managing checks,
  events, entities, filters, handlers, mutators, pipelines, assets, silences, roles,
  and users. It integrates with Nagios, StatsD, Telegraf, and Prometheus, automates
  registration and de-registration of servers, containers, services, and functions,
  and drives self-healing and automated diagnosis from bare metal to Kubernetes. The
  platform ships the sensuctl command-line interface, an open-source Go codebase, and
  role-based access control, with JWT access tokens and persistent API keys for
  authentication and OIDC single sign-on for operators.
